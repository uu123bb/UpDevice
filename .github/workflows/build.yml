name: Build

on:
  push:
    branches: [main]
    # 标签统一不带 v，形如 1.1.0.0；这里放开所有标签，
    # 是否发版由「计算版本号」那步按格式判断。
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布为 Release 的版本号（形如 1.1.0.0），留空则只构建产物"
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: 构建并打包
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          # 版本格式：Major.Second.Patcher1.Patcher2，例如 1.1.0.0
          # 标签不带 v（历史标签带 v 的仍然兼容）
          $candidate = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $candidate = "${{ github.ref_name }}"
          }
          elseif ("${{ inputs.tag }}" -ne "") {
            $candidate = "${{ inputs.tag }}"
          }

          $candidate = $candidate -replace '^[vV]', ''
          $version = "0.0.0-dev"
          $release = "false"

          if ($candidate -ne "") {
            if ($candidate -match '^\d+\.\d+\.\d+\.\d+$') {
              $version = $candidate
              $release = "true"
            }
            else {
              Write-Host "「$candidate」不是 Major.Second.Patcher1.Patcher2 格式，本次只构建不发版"
            }
          }

          Write-Host "版本号: $version (发版: $release)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: 还原依赖
        run: dotnet restore UpDevice.sln

      - name: 编译
        run: dotnet build UpDevice.sln -c Release --no-restore

      # 布局参考 ClassIsland：启动器在根目录，程序进 app-<版本>-0 版本化目录，
      # 更新时新增一个目录切过去，不用覆盖正在运行的文件。
      - name: 发布主进程
        run: >
          dotnet publish src/UpDevice.Service/UpDevice.Service.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/app-${{ steps.ver.outputs.version }}-0

      - name: 发布托盘
        run: >
          dotnet publish src/UpDevice.Tray/UpDevice.Tray.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/app-${{ steps.ver.outputs.version }}-0

      - name: 发布启动器
        run: >
          dotnet publish src/UpDevice.Launcher/UpDevice.Launcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: 整理产物
        shell: pwsh
        run: |
          # 根目录只允许一个单文件启动器，其余全部在 app-<版本>-<序号>/ 里
          $rootFiles = Get-ChildItem -Path publish -File
          $rootDirs = Get-ChildItem -Path publish -Directory

          Write-Host "根目录文件: $($rootFiles.Name -join ', ')"
          Write-Host "根目录目录: $($rootDirs.Name -join ', ')"

          $strayDll = $rootFiles | Where-Object { $_.Extension -in '.dll', '.json', '.pdb' }
          if ($strayDll) {
            throw "根目录出现了不该有的文件：$($strayDll.Name -join ', ')"
          }

          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne 'UpDevice.Launcher.exe') {
            throw "根目录应当只有 UpDevice.Launcher.exe"
          }

          $appDir = $rootDirs | Where-Object { $_.Name -like "app-*" } | Select-Object -First 1
          if (-not $appDir) {
            throw "打包目录结构不正确：缺少 app-* 目录"
          }

          $appExe = Get-ChildItem -Path $appDir.FullName -Filter *.exe | Select-Object -ExpandProperty Name
          Write-Host "程序目录: $($appDir.Name) → $($appExe -join ', ')"
          Write-Host ("产物体积: {0:N1} MB" -f ((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB))

      # 配置了证书才签名，没配置就跳过 —— 无签名的包也能跑，只是会弹「未知发布者」
      - name: 代码签名（可选）
        shell: pwsh
        run: |
          $base64 = "${{ secrets.SIGNING_PFX_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($base64)) {
            Write-Host "未配置 SIGNING_PFX_BASE64，跳过签名" -ForegroundColor Yellow
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            "${{ secrets.SIGNING_PFX_PASSWORD }}",
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

          Write-Host "使用证书: $($cert.Subject) ($($cert.Thumbprint))"

          # runner 上没有这个自签名根，签名时链路校验会判「根证书不受信任」。
          # 临时装进当前用户的信任存储（runner 是一次性的，不会残留）。
          $cerPath = Join-Path $env:RUNNER_TEMP "codesign.cer"
          [IO.File]::WriteAllBytes($cerPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          foreach ($storeName in @("Root", "TrustedPublisher")) {
            try {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName, [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $store.Add($cert)
              $store.Close()
              Write-Host "已把证书装入 $storeName"
            }
            catch {
              Write-Host "装入 $storeName 失败（继续签名）: $($_.Exception.Message)" -ForegroundColor Yellow
            }
          }

          $targets = Get-ChildItem -Path publish -Recurse -Filter *.exe |
            Where-Object { $_.Name -like "UpDevice.*.exe" }

          foreach ($target in $targets) {
            try {
              $result = Set-AuthenticodeSignature -FilePath $target.FullName -Certificate $cert `
                -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
            }
            catch {
              # 时间戳服务器偶尔抽风，退化成不带时间戳签名（证书过期后签名才会失效）
              Write-Host "时间戳失败，改为不带时间戳签名：$($_.Exception.Message)" -ForegroundColor Yellow
              $result = Set-AuthenticodeSignature -FilePath $target.FullName -Certificate $cert -HashAlgorithm SHA256
            }

            Write-Host ("{0} → {1}" -f $target.Name, $result.Status)

            # UnknownError 通常就是「runner 上没装根证书」导致的链路校验失败，签名本身已经写进去了。
            # 真正要拦的是根本没签上（NotSigned）。
            if ($result.Status -eq "NotSigned") {
              throw "签名失败: $($target.Name) ($($result.StatusMessage))"
            }

            if ($result.Status -ne "Valid") {
              Write-Host ("  链路校验未通过（{0}），签名已写入，用户机器安装了证书后即为 Valid" -f $result.StatusMessage) -ForegroundColor Yellow
            }
          }

      - name: 打包 ZIP
        id: zip
        shell: pwsh
        run: |
          $name = "UpDevice-win-x64.zip"
          if ("${{ steps.ver.outputs.release }}" -eq "true") {
            $name = "UpDevice-${{ steps.ver.outputs.version }}-win-x64.zip"
          }

          Compress-Archive -Path publish/* -DestinationPath $name -Force
          Write-Host "产物: $name"

          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$name" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    # 由「计算版本号」判定：只有形如 1.1.0.0 的标签或手动输入才发版
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          files: artifact/**/*.zip
          # ChangeLog 由 GitHub 依据 .github/release.yml 的分类规则自动生成
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
