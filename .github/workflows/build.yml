name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布为 Release 的版本号（如 v1.0.0），留空则只构建产物"
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: 构建并打包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          # tag 形如 v1.0.1.1，去掉前缀就是四段版本号；非 tag 构建标记为开发版
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-dev"
          }
          Write-Host "版本号: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 还原依赖
        run: dotnet restore UpDevice.sln

      - name: 编译
        run: dotnet build UpDevice.sln -c Release --no-restore

      # 两个程序发布到同一目录：配置自举依赖它们在一起，运行时也好分发
      # DebugType=none：不生成 pdb，省得事后删
      - name: 发布主进程
        run: >
          dotnet publish src/UpDevice.Service/UpDevice.Service.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: 发布托盘
        run: >
          dotnet publish src/UpDevice.Tray/UpDevice.Tray.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: 整理产物
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination publish -Force
          if (Test-Path publish/config.json) { Remove-Item publish/config.json -Force }

          $exe = Get-ChildItem publish -Filter *.exe | Select-Object -ExpandProperty Name
          Write-Host "可执行文件: $($exe -join ', ')"
          Write-Host ("产物体积: {0:N1} MB" -f ((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB))

      - name: 打包 ZIP
        id: zip
        shell: pwsh
        run: |
          $name = "UpDevice-win-x64.zip"
          if ("${{ github.ref_type }}" -eq "tag") {
            $name = "UpDevice-${{ github.ref_name }}-win-x64.zip"
          }
          elseif ("${{ inputs.tag }}" -ne "") {
            $name = "UpDevice-${{ inputs.tag }}-win-x64.zip"
          }

          Compress-Archive -Path publish/* -DestinationPath $name -Force
          Write-Host "产物: $name"

          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$name" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    # 推 tag（v*）或手动指定版本号时才发版
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          # tag 触发时用已有 tag；手动触发时按输入创建
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: artifact/**/*.zip
          # ChangeLog 由 GitHub 依据 .github/release.yml 的分类规则自动生成
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
