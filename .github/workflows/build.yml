name: Build

on:
  push:
    branches: [main]
    # 标签统一不带 v，形如 1.1.0.0；这里放开所有标签，
    # 是否发版由「计算版本号」那步按格式判断。
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布为 Release 的版本号（形如 1.1.0.0），留空则只构建产物"
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: 构建并打包
    runs-on: windows-latest
    # 兜底：签名那一步曾经因为弹窗挂死过，宁可整 job 失败也别挂着耗六小时
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 遥测插件是原生 DLL，必须用 MSVC 编（游戏只加载 native plugin）。
      # 产物放到 csproj 约定的位置，发布托盘时会被自动带进 app-*/Telemetry/。
      - name: 编译遥测插件
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "找不到 vswhere.exe，无法定位 MSVC"
          }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "找不到 MSVC C++ 工具链（需要 Microsoft.VisualStudio.Component.VC.Tools.x86.x64）"
          }

          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null

          $outDir = "src/UpDevice.Telemetry.Plugin/bin/Release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 导出靠 .def 文件：SDK 头文件里的声明是普通声明，函数上再加
          # __declspec(dllexport) 会被 MSVC 判成 C2375（different linkage）。
          cl /nologo /LD /O2 /DNDEBUG `
            /I src/UpDevice.Telemetry.Plugin/include `
            src/UpDevice.Telemetry.Plugin/plugin.cpp `
            /Fe:$outDir/UpDevice.Telemetry.dll `
            /Fo:$outDir/ `
            /link /DEF:src/UpDevice.Telemetry.Plugin/UpDevice.Telemetry.def

          $dll = Join-Path $outDir "UpDevice.Telemetry.dll"
          if (-not (Test-Path $dll)) {
            throw "遥测插件编译失败：$dll 未生成"
          }

          Write-Host "遥测插件已生成: $dll ($([Math]::Round((Get-Item $dll).Length / 1KB, 1)) KB)"

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          # 版本格式：Major.Second.Patcher1.Patcher2，例如 1.1.0.0
          # 标签不带 v（历史标签带 v 的仍然兼容）
          $candidate = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $candidate = "${{ github.ref_name }}"
          }
          elseif ("${{ inputs.tag }}" -ne "") {
            $candidate = "${{ inputs.tag }}"
          }

          $candidate = $candidate -replace '^[vV]', ''
          $version = "0.0.0-dev"
          $release = "false"

          if ($candidate -ne "") {
            if ($candidate -match '^\d+\.\d+\.\d+\.\d+$') {
              $version = $candidate
              $release = "true"
            }
            else {
              Write-Host "「$candidate」不是 Major.Second.Patcher1.Patcher2 格式，本次只构建不发版"
            }
          }

          Write-Host "版本号: $version (发版: $release)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: 还原依赖
        run: dotnet restore UpDevice.sln

      - name: 编译
        run: dotnet build UpDevice.sln -c Release --no-restore

      # 布局参考 ClassIsland：启动器在根目录，程序进 app-<版本>-0 版本化目录，
      # 更新时新增一个目录切过去，不用覆盖正在运行的文件。
      - name: 发布主进程
        run: >
          dotnet publish src/UpDevice.Service/UpDevice.Service.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/app-${{ steps.ver.outputs.version }}-0

      - name: 发布托盘
        run: >
          dotnet publish src/UpDevice.Tray/UpDevice.Tray.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/app-${{ steps.ver.outputs.version }}-0

      - name: 发布启动器
        run: >
          dotnet publish src/UpDevice.Launcher/UpDevice.Launcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: 整理产物
        shell: pwsh
        run: |
          # 根目录只允许一个单文件启动器，其余全部在 app-<版本>-<序号>/ 里
          $rootFiles = Get-ChildItem -Path publish -File
          $rootDirs = Get-ChildItem -Path publish -Directory

          Write-Host "根目录文件: $($rootFiles.Name -join ', ')"
          Write-Host "根目录目录: $($rootDirs.Name -join ', ')"

          $strayDll = $rootFiles | Where-Object { $_.Extension -in '.dll', '.json', '.pdb' }
          if ($strayDll) {
            throw "根目录出现了不该有的文件：$($strayDll.Name -join ', ')"
          }

          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne 'UpDevice.Launcher.exe') {
            throw "根目录应当只有 UpDevice.Launcher.exe"
          }

          $appDir = $rootDirs | Where-Object { $_.Name -like "app-*" } | Select-Object -First 1
          if (-not $appDir) {
            throw "打包目录结构不正确：缺少 app-* 目录"
          }

          $plugin = Join-Path $appDir.FullName "Telemetry\UpDevice.Telemetry.dll"
          if (-not (Test-Path $plugin)) {
            throw "程序目录里缺少 Telemetry/UpDevice.Telemetry.dll，遥测功能会不可用"
          }

          $appExe = Get-ChildItem -Path $appDir.FullName -Filter *.exe | Select-Object -ExpandProperty Name
          Write-Host "程序目录: $($appDir.Name) → $($appExe -join ', ')"
          Write-Host ("产物体积: {0:N1} MB" -f ((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB))

      # 配置了证书才签名，没配置就跳过 —— 无签名的包也能跑，只是会弹「未知发布者」
      # 签名这一步踩过两次坑，结构是刻意这么写的：
      #   1. 不往 runner 的证书存储里装根证书 —— 写 Root 会弹系统确认框，非交互会话直接挂死；
      #      装不装只影响「签名后链路校验的状态」，签名本身照样写进文件。
      #   2. 每个文件的签名放进独立作业并限时 —— 时间戳是网络调用，卡住时不抛异常，只能靠超时兜底。
      #   3. 签不上只警告不失败 —— 签名是可选增强，别因为时间戳服务器抽风就让整个发布挂掉。
      - name: 代码签名（可选）
        shell: pwsh
        # 签名只是增强：万一驱动/证书存储那边卡住，限时失败也不能拖垮整包产物
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $base64 = "${{ secrets.SIGNING_PFX_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($base64)) {
            Write-Host "未配置 SIGNING_PFX_BASE64，跳过签名" -ForegroundColor Yellow
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))

          # 密码与 pfx 路径用环境变量传给子作业：子进程会继承，不必出现在命令行里
          $env:UPD_SIGN_PFX = $pfxPath
          $env:UPD_SIGN_PW = "${{ secrets.SIGNING_PFX_PASSWORD }}"

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:UPD_SIGN_PW,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

          Write-Host "使用证书: $($cert.Subject) ($($cert.Thumbprint))"

          # 插件 DLL 一起签：它会被装进别人的游戏目录，带签名更容易被用户信任
          $targets = @(Get-ChildItem -Path publish -Recurse -Filter *.exe |
            Where-Object { $_.Name -like "UpDevice.*.exe" }) +
            @(Get-ChildItem -Path publish -Recurse -Filter "UpDevice.Telemetry.dll")

          $signScript = {
            param([string]$Path, [string]$Timestamp)

            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $env:UPD_SIGN_PFX,
              $env:UPD_SIGN_PW,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

            if ([string]::IsNullOrWhiteSpace($Timestamp)) {
              Set-AuthenticodeSignature -FilePath $Path -Certificate $cert -HashAlgorithm SHA256
            }
            else {
              Set-AuthenticodeSignature -FilePath $Path -Certificate $cert -HashAlgorithm SHA256 -TimestampServer $Timestamp
            }
          }

          $unsigned = @()

          foreach ($target in $targets) {
            $result = $null

            foreach ($attempt in @(
                @{ Label = "（带时间戳）"; Timestamp = "http://timestamp.digicert.com" },
                @{ Label = "（不带时间戳）"; Timestamp = "" })) {

              Write-Host ("签名 {0} {1}" -f $target.Name, $attempt.Label)

              $job = Start-Job -ScriptBlock $signScript -ArgumentList $target.FullName, $attempt.Timestamp
              if (Wait-Job $job -Timeout 60) {
                try {
                  $result = Receive-Job $job -ErrorAction Stop
                }
                catch {
                  Write-Host ("  失败：{0}" -f $_.Exception.Message) -ForegroundColor Yellow
                  $result = $null
                }
              }
              else {
                Write-Host "  超时（60s），停掉重试" -ForegroundColor Yellow
              }

              Stop-Job $job -ErrorAction SilentlyContinue
              Remove-Job $job -Force -ErrorAction SilentlyContinue

              # 时间戳失败的兜底：不带时间戳的签名同样有效（证书过期后才失效）
              if ($result -and $result.Status -ne "NotSigned") {
                break
              }
            }

            if (-not $result -or $result.Status -eq "NotSigned") {
              $unsigned += $target.Name
              Write-Host ("{0} 没签上，继续" -f $target.Name) -ForegroundColor Yellow
              continue
            }

            Write-Host ("{0} → {1}" -f $target.Name, $result.Status)

            if ($result.Status -ne "Valid") {
              Write-Host ("  链路校验未通过（{0}）：runner 上没有这个自签名根，签名已写入，用户装过证书即为 Valid" -f $result.StatusMessage) -ForegroundColor Yellow
            }
          }

          if ($unsigned.Count -gt 0) {
            Write-Host ("以下文件没有签名：{0}" -f ($unsigned -join ", ")) -ForegroundColor Yellow
          }

      - name: 打包 ZIP
        id: zip
        shell: pwsh
        run: |
          $name = "UpDevice-win-x64.zip"
          if ("${{ steps.ver.outputs.release }}" -eq "true") {
            $name = "UpDevice-${{ steps.ver.outputs.version }}-win-x64.zip"
          }

          Compress-Archive -Path publish/* -DestinationPath $name -Force
          Write-Host "产物: $name"

          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$name" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    # 由「计算版本号」判定：只有形如 1.1.0.0 的标签或手动输入才发版
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          files: artifact/**/*.zip
          # ChangeLog 由 GitHub 依据 .github/release.yml 的分类规则自动生成
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
